# File cấu hình deploy cho Render (Blueprint)

# 1. Cấu hình Database PostgreSQL (Nằm trong block databases riêng biệt)
databases:
  - name: digital-signature-db
    databaseName: dbsig
    user: dbadmin
    plan: free

# 2. Cấu hình FastAPI Web Service (Nằm trong block services)
services:
  - type: web
    name: securesign
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0" 
        
      - key: DATABASE_URL
        fromDatabase:
          name: digital-signature-db
          property: connectionString
      
      - key: SECRET_KEY
        generateValue: true 
      - key: ALGORITHM
        value: "HS256"
        
      - key: TSA_URL
        value: "http://timestamp.digicert.com"
        
      - key: SUPABASE_URL
        sync: false 
      - key: SUPABASE_KEY
        sync: false