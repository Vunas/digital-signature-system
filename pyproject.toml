[tool.ruff]
line-length = 100
target-version = "py311"
extend-ignore = ["E203", "E266", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "pyhanko.*",
    "pyhanko_certvalidator.*",
    "asn1crypto.*",
    "pytz.*",
    "passlib.*",
    "jose.*",
    "aiofiles.*",
    "requests.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = "."
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Support for class-based `config` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:.*sqlalchemy.*declarative_base.*:DeprecationWarning",
    "ignore::DeprecationWarning:supabase.*:",
    "ignore::DeprecationWarning:httpx.*:",
    "ignore::DeprecationWarning:passlib.*:",
]
markers = [
    "unit: fast, isolated unit tests",
    "integration: integration tests with FastAPI and DB",
]
