<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - SecureSign</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <a
      href="/"
      class="absolute top-10 left-10 text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors"
    >
      <i class="fa-solid fa-arrow-left mr-2 text-xs"></i> Trang chủ
    </a>
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8">
      <!-- Header -->
      <div class="text-center mb-8">
        <div
          class="w-14 h-14 mx-auto flex items-center justify-center rounded-xl bg-indigo-50"
        >
          <i class="fa-solid fa-shield-halved text-indigo-600 text-xl"></i>
        </div>
        <h2 class="mt-4 text-2xl font-semibold text-gray-800">SecureSign</h2>
        <p class="text-sm text-gray-500 mt-1">
          Đăng nhập vào hệ thống chữ ký số
        </p>
      </div>

      <!-- Form -->
      <form id="login-form" class="space-y-5">
        <div>
          <label class="text-sm text-gray-600 font-medium">Tên đăng nhập</label>
          <div class="relative mt-1">
            <i
              class="fa-regular fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
            ></i>
            <input
              type="text"
              id="username"
              required
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition"
              placeholder="Nhập username (VD: admin)"
            />
          </div>
        </div>

        <div>
          <label class="text-sm text-gray-600 font-medium">Mật khẩu</label>
          <div class="relative mt-1">
            <i
              class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
            ></i>
            <input
              type="password"
              id="password"
              required
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition"
              placeholder="••••••••"
            />
          </div>
        </div>

        <!-- Button -->
        <button
          type="submit"
          id="btn-login"
          class="w-full py-3 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition shadow-sm flex justify-center items-center"
        >
          Đăng nhập
        </button>
      </form>

      <!-- Footer -->
      <p class="text-xs text-gray-400 text-center mt-6">
        © 2026 SecureSign • Demo
      </p>
    </div>

    <script>
      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("btn-login");
          btn.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Đang xác thực...';
          btn.disabled = true;

          // Chuyển FormData sang dạng urlencoded để FastAPI OAuth2PasswordRequestForm đọc được
          const formData = new URLSearchParams();
          formData.append(
            "username",
            document.getElementById("username").value,
          );
          formData.append(
            "password",
            document.getElementById("password").value,
          );

          try {
            const res = await fetch("/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              // QUAN TRỌNG: Thêm credentials: 'same-origin' để trình duyệt nhận và gửi HttpOnly Cookie
              credentials: "same-origin",
              body: formData.toString(),
            });

            const data = await res.json();

            if (res.ok) {
              // Đã bỏ dòng localStorage.setItem('access_token', ...);
              // Vì Backend đã tự động set 2 HttpOnly Cookie (access_token và refresh_token)
              // Trình duyệt sẽ tự động quản lý các token này và giấu khỏi JavaScript.

              // Chỉ lưu username để hiển thị lên Header của UI
              localStorage.setItem(
                "username",
                data.username || document.getElementById("username").value,
              );

              window.location.href = "/dashboard";
            } else {
              throw new Error(data.detail || "Sai thông tin đăng nhập");
            }
          } catch (error) {
            Swal.fire({
              icon: "error",
              title: "Đăng nhập thất bại",
              text: error.message,
            });
          } finally {
            btn.innerHTML = "Đăng nhập";
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
