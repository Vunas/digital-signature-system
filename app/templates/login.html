<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - SecureSign</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto flex items-center justify-center rounded-xl bg-indigo-50">
                <i class="fa-solid fa-shield-halved text-indigo-600 text-xl"></i>
            </div>
            <h2 class="mt-4 text-2xl font-semibold text-gray-800">SecureSign</h2>
            <p class="text-sm text-gray-500 mt-1">Đăng nhập vào hệ thống chữ ký số</p>
        </div>

        <!-- Form -->
        <form id="login-form" class="space-y-5">
            <div>
                <label class="text-sm text-gray-600">Tên đăng nhập</label>
                <div class="relative mt-1">
                    <i class="fa-regular fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input 
                        type="text" 
                        id="username" 
                        required
                        class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition"
                        placeholder="Nhập username"
                    >
                </div>
            </div>

            <div>
                <label class="text-sm text-gray-600">Mật khẩu</label>
                <div class="relative mt-1">
                    <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input 
                        type="password" 
                        id="password" 
                        required
                        class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition"
                        placeholder="••••••••"
                    >
                </div>
            </div>

            <!-- Button -->
            <button 
                type="submit"
                class="w-full py-3 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition shadow-sm"
            >
                Đăng nhập
            </button>
        </form>

        <!-- Footer -->
        <p class="text-xs text-gray-400 text-center mt-6">
            © 2026 SecureSign • Bảo mật & Tin cậy
        </p>
    </div>


    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('username', document.getElementById('username').value);

                    window.location.href = '/dashboard';
                } else {
                    throw new Error(data.detail || 'Sai thông tin đăng nhập');
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Đăng nhập thất bại',
                    text: error.message
                });
            }
        });
    </script>

</body>
</html>
