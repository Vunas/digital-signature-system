<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hệ Thống Chữ Ký Số{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <nav class="bg-indigo-600 text-white shadow-lg relative z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-file-signature text-2xl"></i>
                    <a href="/dashboard" class="font-bold text-xl tracking-wide">SecureSign</a>
                </div>
                
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="/dashboard" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-500 transition">Dashboard</a>
                        <a href="/generate-key" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-500 transition">Quản lý Khóa</a>
                        <a href="/sign" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-500 transition">Ký Văn Bản</a>
                        <a href="/verify" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-500 transition">Xác Thực</a>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <span class="text-sm font-medium"><i class="fa-regular fa-user mr-2"></i><span id="username-display">User</span></span>
                    <button onclick="logout()" class="bg-indigo-500 hover:bg-indigo-700 text-white px-3 py-2 rounded-md text-sm font-medium transition">
                        <i class="fa-solid fa-sign-out-alt"></i> Thoát
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Nội dung chính -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex justify-center text-sm text-gray-500">
            <p>Đồ án An Ninh Mạng Máy Tính &copy; 2026. Xây dựng với FastAPI & TailwindCSS.</p>
        </div>
    </footer>

    <!-- Custom JS -->
    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
