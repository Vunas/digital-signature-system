<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}Hệ Thống Chữ Ký Số | SecureSign{% endblock %}
    </title>

    <link rel="icon" href="/static/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body
    class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased"
  >
    <nav
      class="bg-white/80 backdrop-blur-md border-b border-gray-200 sticky top-0 z-50"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center space-x-2">
            <div
              class="bg-blue-600 text-white p-2 rounded-lg flex items-center justify-center"
            >
              <i class="fa-solid fa-file-signature text-lg"></i>
            </div>
            <a href="/" class="font-bold text-xl tracking-tight text-slate-900">
              Secure<span class="text-blue-600">Sign</span>
            </a>
          </div>

          <div class="hidden md:block">
            <div class="ml-10 flex items-center space-x-1" id="main-nav">
              <a
                href="/dashboard"
                class="nav-link px-3 py-2 rounded-md text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all"
              >
                <i
                  class="fa-solid fa-chart-pie mr-1.5 opacity-70 transition-opacity"
                ></i
                >Tổng quan
              </a>
              <a
                href="/generate-key"
                class="nav-link px-3 py-2 rounded-md text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all"
              >
                <i
                  class="fa-solid fa-key mr-1.5 opacity-70 transition-opacity"
                ></i
                >Quản lý Khóa
              </a>
              <a
                href="/sign"
                class="nav-link px-3 py-2 rounded-md text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all"
              >
                <i class="fa-solid fa-pen-nib mr-1.5 transition-opacity"></i>Ký
                Văn Bản
              </a>
              <a
                href="/verify"
                class="nav-link px-3 py-2 rounded-md text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all"
              >
                <i
                  class="fa-solid fa-shield-check mr-1.5 opacity-70 transition-opacity"
                ></i
                >Xác Thực
              </a>
            </div>
          </div>

          <div
            class="flex items-center space-x-3 border-l border-gray-200 pl-4 ml-2"
          >
            <div
              class="flex items-center space-x-2 text-sm font-medium text-slate-700"
            >
              <div
                class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-600"
              >
                <i class="fa-regular fa-user"></i>
              </div>
              <span id="username-display" class="hidden sm:inline-block"
                >Admin User</span
              >
            </div>
            <button
              onclick="logout()"
              class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-all"
              title="Đăng xuất"
            >
              <i class="fa-solid fa-arrow-right-from-bracket text-lg"></i>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      {% block content %} {% endblock %}
    </main>

    <footer class="bg-white border-t border-slate-200 py-12 mt-auto">
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center"
      >
        <div class="flex items-center space-x-3 mb-6 md:mb-0">
          <div
            class="flex items-center space-x-3 group cursor-pointer"
            onclick="window.scrollTo(0, 0)"
          >
            <div
              class="bg-gradient-to-tr from-blue-600 to-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-blue-500/30 group-hover:shadow-blue-500/50 transition-all duration-300"
            >
              <i class="fa-solid fa-file-signature text-xl"></i>
            </div>
            <span class="font-extrabold text-2xl tracking-tight text-slate-900">
              Secure<span class="text-blue-600">Sign</span>
            </span>
          </div>
        </div>

        <p
          class="text-sm text-slate-500 font-medium text-center md:text-left mb-6 md:mb-0"
        >
          &copy; 2026 by
          <span class="font-semibold text-gray-900">SecureSign</span>. All
          rights reserved.
        </p>

        <div class="flex space-x-5">
          <a
            href="https://github.com/Vunas/digital-signature-system"
            class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-blue-600 hover:text-white transition-all"
          >
            <i class="fa-brands fa-github text-lg"></i>
          </a>
        </div>
      </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Lấy đường dẫn hiện tại của trình duyệt (VD: "/dashboard")
        const currentPath = window.location.pathname;

        // Tìm tất cả các link trong menu có class 'nav-link'
        const navLinks = document.querySelectorAll(".nav-link");

        navLinks.forEach((link) => {
          const linkPath = link.getAttribute("href");

          // Kiểm tra xem href của link có khớp với URL hiện tại không
          if (currentPath === linkPath) {
            // Nếu là nút "Ký Văn Bản" (vốn đã có màu xanh), ta làm nó đậm hơn hoặc giữ nguyên
            if (linkPath === "/sign") {
              link.classList.add("ring-2", "ring-blue-300", "bg-blue-100");
            } else {
              // Nếu là các nút bình thường: Xóa màu xám, thêm nền xanh nhạt + chữ xanh đậm
              link.classList.remove(
                "text-slate-600",
                "hover:text-slate-900",
                "hover:bg-slate-100",
              );
              link.classList.add(
                "bg-blue-50",
                "text-blue-700",
                "font-semibold",
              );

              // Làm sáng icon lên (xóa mờ 70%)
              const icon = link.querySelector("i");
              if (icon) {
                icon.classList.remove("opacity-70");
                icon.classList.add("opacity-100");
              }
            }
          }
        });
      });
    </script>
    <script src="../static/js/main.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
