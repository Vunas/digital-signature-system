<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}Hệ Thống Chữ Ký Số | SecureSign{% endblock %}
    </title>

    <link rel="icon" href="/static/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body
    class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased"
  >
    <nav
      class="bg-white/90 backdrop-blur-md border-b border-gray-200 sticky top-0 z-50"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <!-- Logo & Desktop Menu -->
          <div class="flex items-center">
            <div
              class="flex items-center space-x-2 cursor-pointer"
              onclick="window.location.href = '/'"
            >
              <div
                class="bg-blue-600 text-white p-2 rounded-lg flex items-center justify-center"
              >
                <i class="fa-solid fa-file-signature text-lg"></i>
              </div>
              <a
                href="/"
                class="font-bold text-xl tracking-tight text-slate-900"
              >
                Secure<span class="text-blue-600">Sign</span>
              </a>
            </div>

            <!-- Desktop Menu -->
            <div class="hidden md:block">
              <div class="ml-56 flex items-center space-x-1" id="main-nav">
                <a
                  href="/dashboard"
                  class="nav-link px-3 py-2 rounded-md text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all"
                >
                  <i
                    class="fa-solid fa-chart-pie mr-1.5 opacity-70 transition-opacity"
                  ></i
                  >Tổng quan
                </a>
                <a
                  href="/generate-key"
                  class="nav-link px-3 py-2 rounded-md text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all"
                >
                  <i
                    class="fa-solid fa-key mr-1.5 opacity-70 transition-opacity"
                  ></i
                  >Quản lý Khóa
                </a>
                <a
                  href="/sign"
                  class="nav-link px-3 py-2 rounded-md text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all"
                >
                  <i class="fa-solid fa-pen-nib mr-1.5 transition-opacity"></i
                  >Ký Văn Bản
                </a>
                <a
                  href="/verify"
                  class="nav-link px-3 py-2 rounded-md text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all"
                >
                  <i
                    class="fa-solid fa-shield-halved w-6 text-center opacity-70 mr-2"
                  ></i
                  >Xác Thực
                </a>
                <a
                  href="/log"
                  class="mobile-nav-link block px-3 py-3 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all"
                >
                  <i
                    class="fa-solid fa-shield-halved w-6 text-center opacity-70 mr-2"
                  ></i
                  >Hoạt động
                </a>
              </div>
            </div>
          </div>

          <!-- User Info, Logout & Mobile Toggle -->
          <div
            class="flex items-center space-x-2 sm:space-x-3 md:border-l md:border-gray-200 md:pl-4"
          >
            <!-- User Profile -->
            <div
              class="flex items-center space-x-2 text-sm font-medium text-slate-700"
            >
              <div
                class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-600"
              >
                <i class="fa-regular fa-user"></i>
              </div>
              <span
                id="username-display"
                class="hidden sm:inline-block truncate max-w-[100px] lg:max-w-[200px]"
                >Admin User</span
              >
            </div>

            <!-- Logout Button -->
            <button
              onclick="logout()"
              class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-all"
              title="Đăng xuất"
            >
              <i class="fa-solid fa-arrow-right-from-bracket text-lg"></i>
            </button>

            <!-- Mobile menu button -->
            <button
              id="mobile-menu-btn"
              type="button"
              class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-slate-500 hover:text-slate-900 hover:bg-slate-100 focus:outline-none transition-all"
              aria-expanded="false"
            >
              <span class="sr-only">Mở menu chính</span>
              <i class="fa-solid fa-bars text-xl" id="mobile-menu-icon"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile Menu Panel (Hidden by default) -->
      <div
        id="mobile-menu"
        class="hidden md:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full left-0 top-16"
      >
        <div class="px-4 pt-2 pb-4 space-y-1 sm:px-6">
          <a
            href="/dashboard"
            class="mobile-nav-link block px-3 py-3 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all"
          >
            <i class="fa-solid fa-chart-pie w-6 text-center opacity-70 mr-2"></i
            >Tổng quan
          </a>
          <a
            href="/generate-key"
            class="mobile-nav-link block px-3 py-3 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all"
          >
            <i class="fa-solid fa-key w-6 text-center opacity-70 mr-2"></i>Quản
            lý Khóa
          </a>
          <a
            href="/sign"
            class="mobile-nav-link block px-3 py-3 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all"
          >
            <i class="fa-solid fa-pen-nib w-6 text-center mr-2"></i>Ký Văn Bản
          </a>
          <a
            href="/verify"
            class="mobile-nav-link block px-3 py-3 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all"
          >
            <i
              class="fa-solid fa-shield-halved w-6 text-center opacity-70 mr-2"
            ></i
            >Xác Thực
          </a>
          <a
            href="/audit"
            class="mobile-nav-link block px-3 py-3 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all"
          >
            <i
              class="fa-solid fa-shield-halved w-6 text-center opacity-70 mr-2"
            ></i
            >Phiên bản Audit
          </a>
        </div>
      </div>
    </nav>

    <main
      class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8"
    >
      {% block content %} {% endblock %}
    </main>

    <footer class="bg-white border-t border-slate-200 py-10 mt-auto">
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6"
      >
        <div class="flex items-center space-x-3">
          <div
            class="flex items-center space-x-3 group cursor-pointer"
            onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
          >
            <div
              class="bg-gradient-to-tr from-blue-600 to-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-blue-500/30 group-hover:shadow-blue-500/50 transition-all duration-300"
            >
              <i class="fa-solid fa-file-signature text-xl"></i>
            </div>
            <span class="font-extrabold text-2xl tracking-tight text-slate-900">
              Secure<span class="text-blue-600">Sign</span>
            </span>
          </div>
        </div>

        <p class="text-sm text-slate-500 font-medium text-center md:text-left">
          &copy; 2026 by
          <span class="font-semibold text-gray-900">SecureSign</span>. All
          rights reserved.
        </p>

        <div class="flex space-x-5">
          <a
            href="https://github.com/Vunas/digital-signature-system"
            class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-blue-600 hover:text-white transition-all shadow-sm"
            target="_blank"
          >
            <i class="fa-brands fa-github text-lg"></i>
          </a>
        </div>
      </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // --- Xử lý Menu Mobile (Hamburger) ---
        const mobileMenuBtn = document.getElementById("mobile-menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");
        const mobileMenuIcon = document.getElementById("mobile-menu-icon");

        mobileMenuBtn.addEventListener("click", () => {
          const isExpanded = mobileMenu.classList.contains("hidden");

          if (isExpanded) {
            mobileMenu.classList.remove("hidden");
            // Đổi icon sang X (Close)
            mobileMenuIcon.classList.remove("fa-bars");
            mobileMenuIcon.classList.add("fa-xmark");
          } else {
            mobileMenu.classList.add("hidden");
            // Đổi icon về Bars (Hamburger)
            mobileMenuIcon.classList.remove("fa-xmark");
            mobileMenuIcon.classList.add("fa-bars");
          }
        });

        // --- Xử lý Active Link (cho cả Desktop và Mobile) ---
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll(
          ".nav-link, .mobile-nav-link",
        );

        navLinks.forEach((link) => {
          const linkPath = link.getAttribute("href");

          if (currentPath === linkPath) {
            if (linkPath === "/sign") {
              link.classList.add("ring-2", "ring-blue-300", "bg-blue-100");
            } else {
              link.classList.remove(
                "text-slate-600",
                "hover:text-slate-900",
                "hover:bg-slate-100",
                "hover:bg-slate-50",
              );
              link.classList.add(
                "bg-blue-50",
                "text-blue-700",
                "font-semibold",
              );

              const icon = link.querySelector("i");
              if (icon) {
                icon.classList.remove("opacity-70");
                icon.classList.add("opacity-100");
              }
            }
          }
        });
      });
    </script>
    <script src="../static/js/main.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
